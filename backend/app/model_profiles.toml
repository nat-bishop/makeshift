# Per-model LLM sampling parameter presets.
# The active profile is selected by LLM_MODEL in .env.
# Any LLM_* env var explicitly set in .env overrides the profile value.

[default]
temperature = 0.7
top_p = 1.0
presence_penalty = 0.0
thinking_disabled = true

# Qwen-recommended non-thinking params: temp=0.7, top_p=0.8, top_k=20, presence_penalty=1.5
# Our 35B profile uses top_p=0.95 (tuned); new 4B/9B profiles use official top_p=0.8.
#
# Server config keys (mem_fraction_static, kv_cache_dtype, mamba_ssm_dtype, context_length)
# are read by `make llm-restart` and passed to SGLang. They live here so switching models
# is a single LLM_MODEL change in .env.


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprite Sheet Animated Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; padding: 24px; }
  h1 { margin-bottom: 8px; }
  .controls { margin: 12px 0 24px; display: flex; gap: 16px; align-items: center; }
  .controls label { font-size: 13px; color: #999; }
  .controls input[type=range] { width: 120px; }
  .controls span { font-size: 13px; color: #fff; min-width: 40px; }
  table { border-collapse: collapse; }
  th { background: #1a1a1a; padding: 8px 12px; font-size: 12px; border: 1px solid #333;
       white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  td { border: 1px solid #333; padding: 8px; text-align: center; vertical-align: middle;
       background: #0a0a0a; }
  .subject-label { text-align: right; font-weight: 600; font-size: 14px; padding-right: 16px; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  .meta { font-size: 11px; color: #666; margin-top: 4px; }
  .error { color: #c44; font-size: 12px; padding: 20px; }
  .legend { margin-top: 32px; font-size: 12px; color: #888; }
  .paused-indicator { font-size: 12px; color: #f80; display: none; }
  body.paused .paused-indicator { display: inline; }
</style>
</head>
<body>
<h1>Sprite Sheet Animation Viewer</h1>
<div class="controls">
  <label>FPS:</label>
  <input type="range" id="fps" min="1" max="12" value="4">
  <span id="fps-val">4</span>
  <label>Size:</label>
  <input type="range" id="size" min="80" max="300" value="160">
  <span id="size-val">160px</span>
  <label>Click any animation to pause/resume</label>
  <span class="paused-indicator">PAUSED</span>
</div>
<table id="grid"></table>
<div class="legend">
  Each cell shows the sprite sheet frames cycling as they would in-game.
  2x2 sheets = 4 frames, 4x4 sheets = 16 frames.
</div>

<script>
const APPROACHES = [
  { id: "flux-baseline",          name: "Flux Pro v1.1 (baseline)",    grid: 2 },
  { id: "flux-detailed",          name: "Flux Pro v1.1 (detailed)",    grid: 2 },
  { id: "flux2-template",         name: "FLUX.2 Edit + template",      grid: 2 },
  { id: "nano-banana-template",   name: "Nano Banana + template",      grid: 4 },
  { id: "gemini-template",        name: "Gemini Flash + template",     grid: 4 },
  { id: "gemini-text",            name: "Gemini Flash text-only",      grid: 2 },
];

const SUBJECTS = [
  { id: "cow",    name: "Green Cow (idle)" },
  { id: "dragon", name: "Fire Dragon (walk)" },
  { id: "slime",  name: "Blue Slime (idle)" },
];

// State
let fps = 4;
let canvasSize = 160;
let paused = false;
let frameIndex = 0;
let lastFrameTime = 0;
const cells = []; // { canvas, ctx, img, grid, loaded }

function buildTable() {
  const table = document.getElementById("grid");
  // Header row
  let headerRow = "<tr><th>Subject</th>";
  for (const a of APPROACHES) {
    headerRow += `<th title="${a.name}">${a.name}<br><span style="color:#666">${a.grid}x${a.grid}</span></th>`;
  }
  headerRow += "</tr>";

  let html = headerRow;
  for (const s of SUBJECTS) {
    html += `<tr><td class="subject-label">${s.name}</td>`;
    for (const a of APPROACHES) {
      const cellId = `cell-${a.id}-${s.id}`;
      html += `<td><canvas id="${cellId}" width="${canvasSize}" height="${canvasSize}"></canvas>
                <div class="meta">${a.grid}x${a.grid} = ${a.grid*a.grid} frames</div></td>`;
    }
    html += "</tr>";
  }
  table.innerHTML = html;

  // Load images and set up cells
  cells.length = 0;
  for (const s of SUBJECTS) {
    for (const a of APPROACHES) {
      const cellId = `cell-${a.id}-${s.id}`;
      const canvas = document.getElementById(cellId);
      const ctx = canvas.getContext("2d");
      const img = new Image();
      const cell = { canvas, ctx, img, grid: a.grid, loaded: false };
      img.onload = () => { cell.loaded = true; };
      img.onerror = () => {
        ctx.fillStyle = "#331111";
        ctx.fillRect(0, 0, canvasSize, canvasSize);
        ctx.fillStyle = "#c44";
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("not found", canvasSize/2, canvasSize/2);
      };
      img.src = `${a.id}_${s.id}.png`;
      cells.push(cell);
    }
  }
}

function drawFrame() {
  for (const cell of cells) {
    if (!cell.loaded) continue;
    const { canvas, ctx, img, grid } = cell;
    const totalFrames = grid * grid;
    const frame = frameIndex % totalFrames;
    const col = frame % grid;
    const row = Math.floor(frame / grid);
    const fw = img.naturalWidth / grid;
    const fh = img.naturalHeight / grid;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Draw just this frame, scaled to fill the canvas
    ctx.drawImage(
      img,
      col * fw, row * fh, fw, fh,  // source rect
      0, 0, canvas.width, canvas.height  // dest rect
    );
  }
}

function animate(timestamp) {
  if (!paused) {
    const interval = 1000 / fps;
    if (timestamp - lastFrameTime >= interval) {
      lastFrameTime = timestamp;
      frameIndex++;
      drawFrame();
    }
  }
  requestAnimationFrame(animate);
}

function resizeCanvases() {
  for (const cell of cells) {
    cell.canvas.width = canvasSize;
    cell.canvas.height = canvasSize;
  }
  drawFrame();
}

// Controls
document.getElementById("fps").addEventListener("input", (e) => {
  fps = parseInt(e.target.value);
  document.getElementById("fps-val").textContent = fps;
});

document.getElementById("size").addEventListener("input", (e) => {
  canvasSize = parseInt(e.target.value);
  document.getElementById("size-val").textContent = canvasSize + "px";
  resizeCanvases();
});

document.addEventListener("click", (e) => {
  if (e.target.tagName === "CANVAS") {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
  }
});

// Init
buildTable();
requestAnimationFrame(animate);
</script>
</body>
</html>

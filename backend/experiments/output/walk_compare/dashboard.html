<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk Cycle Prompt Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px;
  }
  h1 { font-size: 24px; margin-bottom: 4px; color: #fff; }
  h2 { font-size: 16px; color: #9ecfff; margin-bottom: 4px; }
  .meta { font-size: 13px; color: #888; margin-bottom: 20px; }
  .meta span { color: #aaa; }

  .controls {
    display: flex; gap: 16px; align-items: center;
    margin-bottom: 20px; padding: 12px 16px;
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px;
  }
  .controls label { font-size: 13px; color: #888; }
  .controls input[type=range] { width: 120px; }
  .controls .val { font-size: 13px; color: #fff; min-width: 30px; }

  .base-row {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; padding: 16px;
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px;
  }
  .base-row h3 {
    font-size: 12px; color: #7b8794; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }
  .base-row .info { font-size: 12px; color: #888; }

  .checker {
    background-image:
      linear-gradient(45deg, #252535 25%, transparent 25%),
      linear-gradient(-45deg, #252535 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #252535 75%),
      linear-gradient(-45deg, transparent 75%, #252535 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    border: 1px solid #333; border-radius: 4px;
    display: inline-block;
  }
  .base-row img { width: 128px; height: 128px; display: block; }

  .strategy-card {
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .strategy-header {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;
  }
  .strategy-desc { font-size: 12px; color: #888; margin-bottom: 12px; }
  .strategy-timing { font-size: 12px; color: #666; margin-left: auto; }

  .strategy-body {
    display: flex; align-items: center; gap: 16px;
  }
  .anim-preview {
    flex-shrink: 0; cursor: pointer; position: relative;
  }
  .anim-preview canvas {
    border: 1px solid #333; border-radius: 4px;
  }
  .anim-preview .pause-overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px; color: rgba(255,255,255,0.6);
    pointer-events: none; display: none;
  }
  .anim-preview.paused .pause-overlay { display: block; }

  .frames-col {
    display: flex; flex-direction: column; gap: 8px;
  }
  .frame-row {
    display: flex; align-items: center; gap: 10px;
  }
  .frame-row .thumb {
    cursor: pointer; flex-shrink: 0;
  }
  .frame-row .thumb img {
    width: 64px; height: 64px;
    border: 2px solid transparent; border-radius: 4px;
    transition: border-color 0.15s;
  }
  .frame-row .thumb img:hover { border-color: #5588cc; }
  .frame-row .thumb.active img {
    border-color: #5588cc;
    box-shadow: 0 0 6px rgba(85,136,204,0.4);
  }
  .frame-row .motion-text {
    font-size: 11px; color: #999; line-height: 1.4;
    max-width: 500px;
  }
  .frame-row .frame-num {
    font-size: 11px; color: #555; width: 14px; flex-shrink: 0;
  }

  .prompt-panel { margin-top: 10px; }
  .prompt-panel summary {
    font-size: 12px; color: #666; cursor: pointer;
  }
  .prompt-panel .prompt-text {
    font-size: 10px; color: #777; margin: 4px 0;
    white-space: pre-wrap; word-break: break-word;
    padding: 8px; background: #0a0f1e; border-radius: 4px;
  }

  .error-banner {
    background: #2a1520; border: 1px solid #4a2030;
    color: #f08080; padding: 8px 12px; border-radius: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>Walk Cycle Prompt Comparison</h1>
<div class="meta">

  Model: <span id="m"></span> |
  Generated: <span id="t"></span>
</div>

<div class="controls">
  <label>FPS:</label>
  <input type="range" id="fps" min="1" max="8" value="4">
  <span class="val" id="fv">4</span>
  <label style="margin-left:16px">Click preview to pause</label>
</div>

<div id="base-container"></div>
<div id="strategies-container"></div>

<script>
const D = {
  "generated_at": "2026-03-27T03:38:20.792360+00:00",
  "image_model": "gemini-3.1-flash-image-preview",
  "text_model": "gemini-3.1-flash-lite-preview",
  "subject": "adventurer",
  "subject_desc": "a human adventurer with a backpack and boots",
  "base_image": "base.png",
  "base_prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, a human adventurer with a backpack and boots, single centered object, contrasting solid background color, no text",
  "strategies": [
    {
      "id": "A_near_far",

      "description": "Depth-based language from the guide: near/far leg, screen-space direction, explicit occlusion",
      "frames": [
        {
          "image": "A_near_far/walk_1.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, near leg extended toward right edge of frame, far leg extended toward left edge, weight centered, single centered object, contrasting solid background color, no text",
          "motion": "walking, near leg extended toward right edge of frame, far leg extended toward left edge, weight centered",
          "error": null
        },
        {
          "image": "A_near_far/walk_2.png",

          "motion": "walking, near leg planted below body, far leg swinging forward partially hidden behind torso",
          "error": null
        },
        {
          "image": "A_near_far/walk_3.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, both legs close together beneath body, near leg pushing off behind, far leg passing forward, single centered object, contrasting solid background color, no text",
          "motion": "walking, both legs close together beneath body, near leg pushing off behind, far leg passing forward",
          "error": null
        },
        {
          "image": "A_near_far/walk_4.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, far leg now leading toward right edge of frame, near leg trailing toward left edge, single centered object, contrasting solid background color, no text",
          "motion": "walking, far leg now leading toward right edge of frame, near leg trailing toward left edge",
          "error": null
        }
      ],
      "timing_s": 9.28,
      "error": null
    },
    {
      "id": "B_silhouette",
      "name": "Silhouette shape only",
      "description": "Describe the overall outline shape without naming individual legs",
      "frames": [
        {
          "image": "B_silhouette/walk_1.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, legs spread in wide triangular stride, one foot forward one foot back, single centered object, contrasting solid background color, no text",
          "motion": "walking, legs spread in wide triangular stride, one foot forward one foot back",
          "error": null
        },
        {
          "image": "B_silhouette/walk_2.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, front foot planted, back leg bent at knee swinging forward, narrow stance, single centered object, contrasting solid background color, no text",
          "motion": "walking, front foot planted, back leg bent at knee swinging forward, narrow stance",
          "error": null
        },
        {
          "image": "B_silhouette/walk_3.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, legs close together passing beneath body, compact upright silhouette, single centered object, contrasting solid background color, no text",
          "motion": "walking, legs close together passing beneath body, compact upright silhouette",
          "error": null
        },
        {
          "image": "B_silhouette/walk_4.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, legs spread in wide stride again, opposite foot now leading, single centered object, contrasting solid background color, no text",
          "motion": "walking, legs spread in wide stride again, opposite foot now leading",
          "error": null
        }
      ],
      "timing_s": 13.44,
      "error": null
    },
    {
      "id": "C_phase_names",
      "name": "Animation phase names",
      "description": "Classic walk cycle phase terminology: contact, recoil, passing, high-point",
      "frames": [
        {
          "image": "C_phase_names/walk_1.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, contact pose, front heel striking ground, back foot pushing off, arms counterbalanced, single centered object, contrasting solid background color, no text",
          "motion": "walking, contact pose, front heel striking ground, back foot pushing off, arms counterbalanced",
          "error": null
        },
        {
          "image": "C_phase_names/walk_2.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, recoil pose, front leg absorbing weight, body slightly compressed, back foot lifting, single centered object, contrasting solid background color, no text",
          "motion": "walking, recoil pose, front leg absorbing weight, body slightly compressed, back foot lifting",
          "error": null
        },
        {
          "image": "C_phase_names/walk_3.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, passing pose, weight on one straight leg, free leg swinging past, body at tallest, single centered object, contrasting solid background color, no text",
          "motion": "walking, passing pose, weight on one straight leg, free leg swinging past, body at tallest",
          "error": null
        },
        {
          "image": "C_phase_names/walk_4.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, high-point pose, free leg reaching forward, planted foot on toes, body stretched tall, single centered object, contrasting solid background color, no text",
          "motion": "walking, high-point pose, free leg reaching forward, planted foot on toes, body stretched tall",
          "error": null
        }
      ],
      "timing_s": 9.15,
      "error": null
    },
    {
      "id": "D_minimal",
      "name": "Minimal motion cues",
      "description": "Very short descriptions, just enough to imply different walk positions",
      "frames": [
        {
          "image": "D_minimal/walk_1.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, stride forward, arms swinging, single centered object, contrasting solid background color, no text",
          "motion": "walking, stride forward, arms swinging",
          "error": null
        },
        {
          "image": "D_minimal/walk_2.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, weight on front foot, shifting balance, single centered object, contrasting solid background color, no text",
          "motion": "walking, weight on front foot, shifting balance",
          "error": null
        },
        {
          "image": "D_minimal/walk_3.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, legs passing, upright stance, single centered object, contrasting solid background color, no text",
          "motion": "walking, legs passing, upright stance",
          "error": null
        },
        {
          "image": "D_minimal/walk_4.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, walking, pushing off back foot, mid-stride, single centered object, contrasting solid background color, no text",
          "motion": "walking, pushing off back foot, mid-stride",
          "error": null
        }
      ],
      "timing_s": 14.04,
      "error": null
    },
    {
      "id": "E_llm_generated",
      "name": "LLM-generated (current system prompt)",
      "description": "Frame descriptions generated by the animation LLM agent",
      "frames": [
        {
          "image": "E_llm_generated/walk_1.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, Contact pose: near leg extended forward, far leg extended backward, torso upright, backpack straps swinging slightly forward., single centered object, contrasting solid background color, no text",
          "motion": "Contact pose: near leg extended forward, far leg extended backward, torso upright, backpack straps swinging slightly forward.",
          "error": null
        },
        {
          "image": "E_llm_generated/walk_2.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, Down pose: near leg bent, body slightly squashed, far leg lifting off ground, backpack shifting downward., single centered object, contrasting solid background color, no text",
          "motion": "Down pose: near leg bent, body slightly squashed, far leg lifting off ground, backpack shifting downward.",
          "error": null
        },
        {
          "image": "E_llm_generated/walk_3.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, Passing pose: near leg straight under body, far leg lifted high, torso stretched upward, backpack trailing behind., single centered object, contrasting solid background color, no text",
          "motion": "Passing pose: near leg straight under body, far leg lifted high, torso stretched upward, backpack trailing behind.",
          "error": null
        },
        {
          "image": "E_llm_generated/walk_4.png",
          "prompt": "mixed media collage style paper cutout, side view facing right, flat lighting, clean edges, adventurer, Up pose: near leg lifting, far leg moving forward, body rising, backpack swaying slightly toward right edge., single centered object, contrasting solid background color, no text",
          "motion": "Up pose: near leg lifting, far leg moving forward, body rising, backpack swaying slightly toward right edge.",
          "error": null
        }
      ],
      "timing_s": 12.98,
      "error": null
    }
  ]
};
let fps = 4;
const anims = [];

document.getElementById('m').textContent = D.image_model;
document.getElementById('t').textContent = new Date(D.generated_at).toLocaleString();
document.getElementById('fps').addEventListener('input', e => {
  fps = parseInt(e.target.value);
  document.getElementById('fv').textContent = fps;
});

// Base sprite
document.getElementById('base-container').innerHTML = `
  <div class="base-row">
    <div class="checker"><img src="${D.base_image}" alt="base"></div>
    <div>
      <h3>Base Sprite (shared reference)</h3>
      <div class="info">${D.subject_desc}</div>
    </div>
  </div>`;

const sc = document.getElementById('strategies-container');

D.strategies.forEach((strat, si) => {
  const card = document.createElement('div');
  card.className = 'strategy-card';
  const aid = `a${si}`;

  let framesHtml = '';
  strat.frames.forEach((f, fi) => {
    const err = f.error ? ' style="opacity:0.3"' : '';
    framesHtml += `
      <div class="frame-row">
        <span class="frame-num">${fi+1}</span>
        <div class="thumb" data-a="${aid}" data-f="${fi}">
          <div class="checker">
            <img src="${f.error ? '' : f.image}" alt="f${fi+1}"${err}
                 onerror="this.style.opacity=0.2">
          </div>
        </div>
        <div class="motion-text">${f.motion}</div>
      </div>`;
  });

  let promptsHtml = '';
  strat.frames.forEach((f, fi) => {
    promptsHtml += `<div class="prompt-text">${fi+1}. ${f.prompt}</div>`;
  });

  card.innerHTML = `
    <div class="strategy-header">
      <h2>${strat.name}</h2>
      <span class="strategy-timing">${strat.timing_s}s</span>
    </div>
    <div class="strategy-desc">${strat.description}</div>
    <div class="strategy-body">
      <div class="anim-preview" id="${aid}-p">
        <div class="checker">
          <canvas id="${aid}-c" width="128" height="128"></canvas>
        </div>
        <div class="pause-overlay">||</div>
      </div>
      <div class="frames-col">${framesHtml}</div>
    </div>
    <div class="prompt-panel">
      <details><summary>Full image prompts</summary>${promptsHtml}</details>
    </div>`;
  sc.appendChild(card);

  const validFrames = strat.frames.filter(f => !f.error);
  const images = validFrames.map(f => {
    const img = new window.Image();
    img.src = f.image;
    return img;
  });
  const state = { id: aid, fi: 0, paused: false, images, loaded: false };
  if (images.length > 0) images[0].onload = () => { state.loaded = true; };
  anims.push(state);

  document.getElementById(`${aid}-p`).addEventListener('click', () => {
    state.paused = !state.paused;
    document.getElementById(`${aid}-p`).classList.toggle('paused', state.paused);
  });
});

document.querySelectorAll('.thumb').forEach(t => {
  t.addEventListener('click', e => {
    e.stopPropagation();
    const aid = t.dataset.a;
    const fi = parseInt(t.dataset.f);
    const st = anims.find(a => a.id === aid);
    if (st) {
      st.fi = fi; st.paused = true;
      document.getElementById(`${aid}-p`).classList.add('paused');
      draw(st);
    }
  });
});

function draw(st) {
  const c = document.getElementById(`${st.id}-c`);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const img = st.images[st.fi % st.images.length];
  if (img && img.complete && img.naturalWidth > 0)
    ctx.drawImage(img, 0, 0, c.width, c.height);
  document.querySelectorAll(`[data-a="${st.id}"]`).forEach((t, i) =>
    t.classList.toggle('active', i === st.fi % st.images.length));
}

let last = 0;
function loop(ts) {
  if (ts - last >= 1000/fps) {
    last = ts;
    anims.forEach(st => {
      if (!st.paused && st.loaded && st.images.length > 0) {
        st.fi = (st.fi + 1) % st.images.length;
        draw(st);
      }
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(() => anims.forEach(draw), 500);
</script>
</body>
</html>

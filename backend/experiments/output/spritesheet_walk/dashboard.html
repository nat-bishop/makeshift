<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spritesheet Walk Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; color: #fff; }
  h2 { font-size: 15px; color: #9ecfff; margin-bottom: 2px; }
  .meta { font-size: 12px; color: #888; margin-bottom: 20px; }
  .meta span { color: #aaa; }

  .controls {
    display: flex; gap: 16px; align-items: center;
    margin-bottom: 20px; padding: 10px 16px;
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px;
  }
  .controls label { font-size: 13px; color: #888; }
  .controls input[type=range] { width: 120px; }
  .controls .val { font-size: 13px; color: #fff; min-width: 30px; }

  .strategy-card {
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }
  .strategy-header {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px;
  }
  .strategy-desc { font-size: 11px; color: #777; margin-bottom: 10px; }
  .strategy-timing { font-size: 11px; color: #555; margin-left: auto; }

  .strategy-body {
    display: flex; gap: 16px; align-items: flex-start;
  }

  .sheet-col { flex-shrink: 0; text-align: center; }
  .sheet-col img {
    width: 200px; height: 200px;
    border: 1px solid #333; border-radius: 4px;
    cursor: pointer;
  }
  .sheet-col .label {
    font-size: 10px; color: #555; margin-top: 4px;
  }

  .anim-col {
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .anim-preview {
    cursor: pointer; position: relative;
  }
  .anim-preview canvas {
    border: 1px solid #333; border-radius: 4px;
  }
  .anim-preview .pause-overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px; color: rgba(255,255,255,0.5);
    pointer-events: none; display: none;
  }
  .anim-preview.paused .pause-overlay { display: block; }
  .anim-label { font-size: 10px; color: #555; }

  .checker {
    background-image:
      linear-gradient(45deg, #252535 25%, transparent 25%),
      linear-gradient(-45deg, #252535 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #252535 75%),
      linear-gradient(-45deg, transparent 75%, #252535 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    border: 1px solid #333; border-radius: 4px;
    display: inline-block;
  }

  .frames-strip {
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  }
  .frame-thumb {
    cursor: pointer;
  }
  .frame-thumb img {
    width: 56px; height: 56px;
    border: 2px solid transparent; border-radius: 3px;
    transition: border-color 0.15s;
  }
  .frame-thumb img:hover { border-color: #5588cc; }
  .frame-thumb.active img {
    border-color: #5588cc;
    box-shadow: 0 0 6px rgba(85,136,204,0.4);
  }

  details { margin-top: 8px; }
  summary { font-size: 11px; color: #666; cursor: pointer; }
  .prompt-text {
    font-size: 10px; color: #777; margin: 6px 0;
    white-space: pre-wrap; word-break: break-word;
    padding: 8px; background: #0a0f1e; border-radius: 4px;
    max-height: 200px; overflow-y: auto;
  }

  .error-banner {
    background: #2a1520; border: 1px solid #4a2030;
    color: #f08080; padding: 8px 12px; border-radius: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>Spritesheet Walk Comparison</h1>
<div class="meta">
  Character: <span>a human adventurer with a backpack and boots, mixed media co...</span> |
  Model: <span id="m"></span> |
  <span id="t"></span>
</div>

<div class="controls">
  <label>FPS:</label>
  <input type="range" id="fps" min="1" max="12" value="4">
  <span class="val" id="fv">4</span>
  <label style="margin-left:12px">Click animation to pause</label>
</div>

<div id="sc"></div>

<script>
const D = {
  "generated_at": "2026-03-27T04:07:21.651413+00:00",
  "image_model": "gemini-3.1-flash-image-preview",
  "character": "a human adventurer with a backpack and boots, mixed media collage style paper cutout, side view facing right",
  "strategies": [
    {
      "id": "A_identical_2x2",
      "name": "IDENTICAL constraint (2x2)",
      "description": "Per-frame descriptions with IDENTICAL/CRITICAL markers. No template. Round 6/7 style.",
      "grid": 2,
      "sheet": "A_identical_2x2/sheet.png",
      "frames": [
        "A_identical_2x2/frame_01.png",
        "A_identical_2x2/frame_02.png",
        "A_identical_2x2/frame_03.png",
        "A_identical_2x2/frame_04.png"
      ],
      "timing_s": 21.73,
      "error": null,
      "prompt": "2x2 grid sprite sheet with 4 animation frames of a walk cycle, each frame centered in its quadrant. a human adventurer with a backpack and boots, mixed media collage style paper cutout, side view facing right. Frame 1 (top-left): standing with legs in wide stride, one leg forward one leg back, arms counterbalanced. Frame 2 (top-right): IDENTICAL character, legs passing through center close together, body at tallest point, arms at sides. Frame 3 (bottom-left): IDENTICAL character, legs in wide st",
      "extra": ""
    },
    {
      "id": "B_llm_choreo_2x2",
      "name": "LLM choreography (2x2)",
      "description": "LLM rewrites into CHARACTER + CHOREOGRAPHY, wrapped in strict requirements. Round 3 style.",
      "grid": 2,
      "sheet": "B_llm_choreo_2x2/sheet.png",
      "frames": [
        "B_llm_choreo_2x2/frame_01.png",
        "B_llm_choreo_2x2/frame_02.png",
        "B_llm_choreo_2x2/frame_03.png",
        "B_llm_choreo_2x2/frame_04.png"
      ],
      "timing_s": 33.07,
      "error": null,
      "prompt": "STRICT TECHNICAL REQUIREMENTS:\n\nFORMAT: A single image containing a two-by-two grid of equally sized cells.\nEvery cell must be the exact same dimensions, perfectly aligned, with no gaps or overlap.\n\nFORBIDDEN: Absolutely no text, no numbers, no letters, no digits, no labels,\nno watermarks, no signatures, no UI elements anywhere in the image.\n\nCONSISTENCY: The exact same single character must appear in every cell.\nSame proportions, same art style, same level of detail, same camera angle throughou",
      "extra": "CHARACTER: A stout, adventurous explorer rendered in a tactile mixed-media collage style. The body is constructed from layered, hand-torn construction paper in earthy ochre and deep slate tones. A bulky, oversized backpack made of textured craft-paper scraps sits high on the shoulders, swaying slightly with every movement. The adventurer sports sturdy, oversized boots cut from dark charcoal cardstock with visible rough edges. The silhouette is chunky and rounded, with exaggerated limb joints mad"
    },
    {
      "id": "C_template_4x4",
      "name": "Template-guided (4x4)",
      "description": "4x4 numbered template image + system instruction. 16 frames for smoother animation.",
      "grid": 4,
      "sheet": "C_template_4x4/sheet.png",
      "frames": [
        "C_template_4x4/frame_01.png",
        "C_template_4x4/frame_02.png",
        "C_template_4x4/frame_03.png",
        "C_template_4x4/frame_04.png",
        "C_template_4x4/frame_05.png",
        "C_template_4x4/frame_06.png",
        "C_template_4x4/frame_07.png",
        "C_template_4x4/frame_08.png",
        "C_template_4x4/frame_09.png",
        "C_template_4x4/frame_10.png",
        "C_template_4x4/frame_11.png",
        "C_template_4x4/frame_12.png",
        "C_template_4x4/frame_13.png",
        "C_template_4x4/frame_14.png",
        "C_template_4x4/frame_15.png",
        "C_template_4x4/frame_16.png"
      ],
      "timing_s": 17.13,
      "error": null,
      "prompt": "a human adventurer with a backpack and boots, mixed media collage style paper cutout, side view facing right, walking in a 16-frame walk cycle loop. Cells 1-4 (row 1): right stride contact through to passing pose. Cells 5-8 (row 2): passing pose through to left stride contact. Cells 9-12 (row 3): left stride contact through to passing pose. Cells 13-16 (row 4): passing pose back to right stride contact, completing the loop. Same character in every cell. Smooth gradual transitions between poses. ",
      "extra": ""
    },
    {
      "id": "D_template_2x2",
      "name": "Template-guided (2x2)",
      "description": "2x2 numbered template image + system instruction. 4 frames.",
      "grid": 2,
      "sheet": "D_template_2x2/sheet.png",
      "frames": [
        "D_template_2x2/frame_01.png",
        "D_template_2x2/frame_02.png",
        "D_template_2x2/frame_03.png",
        "D_template_2x2/frame_04.png"
      ],
      "timing_s": 25.03,
      "error": null,
      "prompt": "a human adventurer with a backpack and boots, mixed media collage style paper cutout, side view facing right, walking in a 4-frame walk cycle loop. Cell 1: stride pose, one leg forward one back, arms counterbalanced. Cell 2: passing pose, legs close together, body upright. Cell 3: stride pose opposite leg leading, arms swapped. Cell 4: passing pose again, completing the loop. Same character in every cell. Full body, head to toe. Solid #1a1a1a background.",
      "extra": ""
    },
    {
      "id": "E_textimg_identical",
      "name": "TEXT+IMAGE modality (2x2)",
      "description": "Same as A but with response_modalities=[TEXT, IMAGE] so model reasons before drawing.",
      "grid": 2,
      "sheet": "E_textimg_identical/sheet.png",
      "frames": [
        "E_textimg_identical/frame_01.png",
        "E_textimg_identical/frame_02.png",
        "E_textimg_identical/frame_03.png",
        "E_textimg_identical/frame_04.png"
      ],
      "timing_s": 12.43,
      "error": null,
      "prompt": "2x2 grid sprite sheet with 4 animation frames of a walk cycle, each frame centered in its quadrant. a human adventurer with a backpack and boots, mixed media collage style paper cutout, side view facing right. Frame 1 (top-left): standing with legs in wide stride, one leg forward one leg back, arms counterbalanced. Frame 2 (top-right): IDENTICAL character, legs passing through center close together, body at tallest point, arms at sides. Frame 3 (bottom-left): IDENTICAL character, legs in wide st",
      "extra": ""
    }
  ]
};
let fps = 4;
const anims = [];

document.getElementById('m').textContent = D.image_model;
document.getElementById('t').textContent = new Date(D.generated_at).toLocaleString();
document.getElementById('fps').addEventListener('input', e => {
  fps = parseInt(e.target.value);
  document.getElementById('fv').textContent = fps;
});

const sc = document.getElementById('sc');

D.strategies.forEach((strat, si) => {
  const card = document.createElement('div');
  card.className = 'strategy-card';
  const aid = `a${si}`;

  if (strat.error) {
    card.innerHTML = `
      <div class="strategy-header">
        <h2>${strat.name}</h2>
        <span class="strategy-timing">${strat.timing_s}s</span>
      </div>
      <div class="strategy-desc">${strat.description}</div>
      <div class="error-banner">${strat.error}</div>`;
    sc.appendChild(card);
    return;
  }

  let thumbsHtml = '';
  strat.frames.forEach((f, fi) => {
    thumbsHtml += `
      <div class="frame-thumb" data-a="${aid}" data-f="${fi}">
        <div class="checker">
          <img src="${f}" alt="f${fi+1}" onerror="this.style.opacity=0.2">
        </div>
      </div>`;
  });

  let extraHtml = '';
  if (strat.extra) {
    extraHtml = `
      <details><summary>LLM Rewrite</summary>
        <div class="prompt-text">${strat.extra}</div>
      </details>`;
  }

  card.innerHTML = `
    <div class="strategy-header">
      <h2>${strat.name}</h2>
      <span class="strategy-timing">${strat.timing_s}s | ${strat.grid}x${strat.grid} (${strat.frames.length} frames)</span>
    </div>
    <div class="strategy-desc">${strat.description}</div>
    <div class="strategy-body">
      <div class="sheet-col">
        <a href="${strat.sheet}" target="_blank">
          <img src="${strat.sheet}" alt="sheet">
        </a>
        <div class="label">Raw sheet (click to enlarge)</div>
      </div>
      <div class="anim-col">
        <div class="anim-preview" id="${aid}-p">
          <div class="checker">
            <canvas id="${aid}-c" width="128" height="128"></canvas>
          </div>
          <div class="pause-overlay">||</div>
        </div>
        <div class="anim-label">Animated preview</div>
      </div>
      <div class="frames-strip">${thumbsHtml}</div>
    </div>
    <details><summary>Prompt</summary>
      <div class="prompt-text">${strat.prompt}</div>
    </details>
    ${extraHtml}`;
  sc.appendChild(card);

  const imgs = strat.frames.map(f => {
    const img = new window.Image(); img.src = f; return img;
  });
  const st = { id: aid, fi: 0, paused: false, images: imgs, loaded: false };
  if (imgs.length > 0) imgs[0].onload = () => { st.loaded = true; };
  anims.push(st);

  document.getElementById(`${aid}-p`).addEventListener('click', () => {
    st.paused = !st.paused;
    document.getElementById(`${aid}-p`).classList.toggle('paused', st.paused);
  });
});

document.querySelectorAll('.frame-thumb').forEach(t => {
  t.addEventListener('click', e => {
    e.stopPropagation();
    const aid = t.dataset.a, fi = parseInt(t.dataset.f);
    const st = anims.find(a => a.id === aid);
    if (st) {
      st.fi = fi; st.paused = true;
      document.getElementById(`${aid}-p`).classList.add('paused');
      draw(st);
    }
  });
});

function draw(st) {
  const c = document.getElementById(`${st.id}-c`);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const img = st.images[st.fi % st.images.length];
  if (img && img.complete && img.naturalWidth > 0)
    ctx.drawImage(img, 0, 0, c.width, c.height);
  document.querySelectorAll(`[data-a="${st.id}"]`).forEach((t, i) =>
    t.classList.toggle('active', i === st.fi % st.images.length));
}

let last = 0;
function loop(ts) {
  if (ts - last >= 1000/fps) {
    last = ts;
    anims.forEach(st => {
      if (!st.paused && st.loaded && st.images.length > 0) {
        st.fi = (st.fi + 1) % st.images.length;
        draw(st);
      }
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(() => anims.forEach(draw), 500);
</script>
</body>
</html>

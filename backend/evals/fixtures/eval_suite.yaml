# ---------------------------------------------------------------------------
# Creation tests � objects to run through create_object() with expected ranges
# ---------------------------------------------------------------------------
# Ranges [lo, hi] are binary pass/fail. Exact values (bool, int) are exact match.

creation_tests:
  - name: iron sword
    expected:
      mass_kg: [0.5, 3]
      height_cm: [50, 120]
      bounce: [5, 30]
      gravity: [50, 75]
      active: false
      affordance: 0
      surface: 1
      durability: [3, 4]
      conducts_electricity: true
      catches_fire: false


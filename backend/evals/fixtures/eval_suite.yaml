# ---------------------------------------------------------------------------
# Pairwise interaction expectations
# ---------------------------------------------------------------------------
# damage ranges: [lo, hi]. State: string or list of acceptable strings.
# A/B sides follow fixture order; orient_expected() handles eval_pair's sort.

pairs:
  - pair: [fire, wood]
    expected: { damage_b: [10, 100], state_b: [burning], continuous: true }
    note: "fire ignites wood — initial tick is light, ongoing burn does real damage"

  - pair: [fire, ice]
    expected: { damage_b: [0, 75], state_b: [remove_frozen, wet] }
    note: "fire melts ice — state change is the main effect, damage optional"

  - pair: [water, fire]
    expected: { state_b: [remove_burning, wet] }
    note: "water extinguishes fire"

  - pair: [sword, glass bottle]
    expected: { damage_b: [25, 100], continuous: false }
    note: "sharp shatters fragile — instant, not ongoing"

  - pair: [boulder, glass bottle]
    expected: { damage_b: [75, 100] }
    note: "100kg boulder obliterates glass"

  - pair: [ice cube, lava]
    expected: { damage_a: [75, 100] }
    note: "ice cube vaporizes on contact with lava"

  - pair: [dynamite, campfire]
    expected: { damage_a: [30, 100], damage_b: [20, 100] }
    note: "heat detonates explosive"

  - pair: [bomb, glass window]
    expected: { damage_b: [40, 100], force_b: [20, 100], continuous: false }
    note: "explosion shatters and blows away fragile — instant"

  - pair: [lightning rod, iron sword]
    expected: { state_b: [electrified] }
    note: "electric + metallic = electrify"

  - pair: [live wire, water puddle]
    expected: { state_b: [electrified] }
    note: "electric + liquid = electrify"

  - pair: [lightning, person]
    expected: { damage_b: [50, 100], state_b: [electrified] }
    note: "lightning strike is severe and electrifies"

  - pair: [acid, glass bottle]
    expected: { damage_b: [25, 100] }
    note: "strong acids dissolve glass — significant damage expected"

  - pair: [acid, stone wall]
    expected: { damage_b: [0, 50], continuous: true }
    note: "acid corrodes continuously — 0 damage acceptable for indestructible"

  - pair: [acid, person]
    expected: { damage_b: [10, 75], continuous: true }
    note: "acid burns living — ongoing corrosion"

  - pair: [fan, feather]
    expected: { force_b: [25, 100] }
    note: "wind pushes light"

  - pair: [poison mushroom, rabbit]
    expected: { damage_b: [0, 50] }
    note: "poison near living — proximity may or may not cause damage"

  - pair: [tar pit, person]
    expected: { continuous: true }
    note: "tar slows movement"

  - pair: [rock, rock]
    expected: { damage_a: [0, 10], damage_b: [0, 10] }
    note: "inert pair, minimal"

  - pair: [wooden sword, wooden shield]
    expected: { damage_b: [0, 20] }
    note: "wood on wood, minor"

  - pair: [bomb, person]
    expected: { damage_b: [50, 100], force_b: [20, 100] }
    note: "bomb explosion devastates and blows person back"

  - pair: [fire, balloon]
    expected: { damage_b: [50, 100] }
    note: "heat pops balloon"

  - pair: [boulder, wooden sword]
    expected: { damage_b: [50, 100] }
    note: "heavy crushes light wood"

  - pair: [lightning, water]
    expected: { state_b: [electrified] }
    note: "electricity conducts through water"

  - pair: [fire, person]
    expected: { damage_b: [10, 100], state_b: [burning], continuous: true }
    note: "fire burns people — initial tick light, ongoing burn does real damage"

  - pair: [sword, person]
    expected: { damage_b: [10, 100] }
    note: "weapon wounds people — at minimum a scratch"

  - pair: [campfire, person]
    expected: { damage_b: [10, 75], state_b: [burning], continuous: true }
    note: "standing in campfire — initial tick light, burning state accumulates"

  - pair: [acid, iron sword]
    expected: { damage_b: [0, 50], continuous: true }
    note: "acid on steel — corrosion may be slow or negligible"

  - pair: [lava, iron sword]
    expected: { damage_b: [25, 100], continuous: true }
    note: "lava continuously melts metal"

  - pair: [poison mushroom, person]
    expected: { damage_b: [0, 50] }
    note: "poison near living — proximity may or may not cause damage"

  - pair: [water, person]
    expected: { state_b: [wet] }
    note: "water wets person"

  - pair: [water, wood]
    expected: { state_b: [wet] }
    note: "water soaks wood"

  - pair: [ice, person]
    expected: { state_b: [frozen, wet], damage_b: [5, 50] }
    note: "ice freezes or wets person — both valid"

  - pair: [ice cube, iron sword]
    expected: { state_b: [frozen, wet] }
    note: "ice cube on metal — may freeze or melt (both valid)"

  - pair: [feather, campfire]
    expected: { damage_a: [25, 100] }
    note: "feather burns easily in fire"

  - pair: [glass bottle, rock]
    expected: { damage_a: [25, 100], damage_b: [0, 15] }
    note: "glass shatters against rock; rock barely scratched"

  - pair: [dynamite, lava]
    expected: { damage_a: [30, 100] }
    note: "lava heat detonates dynamite"

  - pair: [bomb, boulder]
    expected: { damage_a: [20, 100], damage_b: [10, 75] }
    note: "explosion damages both — boulder is tough but not immune"

  - pair: [feather, feather]
    expected: { damage_a: [0, 5], damage_b: [0, 5] }
    note: "two feathers do nothing to each other"

  - pair: [fan, smoke cloud]
    expected: { force_b: [10, 100] }
    note: "wind disperses gas"

  - pair: [fan, rock]
    expected: { force_b: [0, 10] }
    note: "fan cannot move heavy rock — mass matters"

  - pair: [magnet, sword]
    expected: { force_b: [10, 100] }
    note: "magnet exerts strong force on metallic sword — LLM outputs positive for attraction"

  - pair: [boulder, person]
    expected: { damage_b: [40, 100], force_b: [20, 100] }
    note: "boulder crushes and sends person flying"

  - pair: [bomb, campfire]
    expected: { damage_a: [30, 100], damage_b: [10, 100] }
    note: "fire detonates bomb — campfire is just sticks, light damage acceptable"

  - pair: [lightning, iron sword]
    expected: { damage_b: [10, 75], state_b: [electrified] }
    note: "lightning damages and electrifies metal"

  - pair: [tornado, person]
    expected: { damage_b: [10, 75], force_b: [20, 100] }
    note: "tornado tosses person — should deal damage and knock back"

  - pair: [lava, ice]
    expected: { damage_b: [50, 100], state_b: [remove_frozen, wet] }
    note: "lava obliterates ice — melts and damages"

  - pair: [bouncy ball, rock]
    expected: { damage_a: [0, 15], damage_b: [0, 5] }
    note: "bouncy ball rebounds off rock — minimal damage"

  - pair: [iron sword, wood]
    expected: { damage_b: [10, 75] }
    note: "sharp cuts wood — different mechanic than crushing"

  - pair: [mountain, iron sword]
    expected: { damage_a: [0, 5], damage_b: [0, 30] }
    note: "sword does nothing to mountain — extreme mass asymmetry"

  - pair: [iron sword, iron sword]
    expected: { damage_a: [0, 25], damage_b: [0, 25] }
    note: "metal clangs — minor symmetric damage"

  - pair: [dynamite, bomb]
    expected: { damage_a: [40, 100], damage_b: [40, 100] }
    note: "explosive + explosive = mutual destruction"

  - pair: [tar pit, feather]
    expected: { continuous: true }
    note: "sticky traps light objects"

  - pair: [water, dynamite]
    expected: { damage_b: [0, 20] }
    note: "water soaks fuse — should not detonate"

  - pair: [campfire, wood]
    expected: { damage_b: [10, 75], state_b: [burning], continuous: true }
    note: "campfire ignites nearby wood via heat field"

  - pair: [ice, water]
    expected: { state_b: [frozen] }
    note: "ice freezes water — temperature transfer"

  - pair: [magnet, wood]
    expected: { force_b: [0, 10] }
    note: "magnet does not attract wood — no magnetic pull"


# ---------------------------------------------------------------------------
# Screening expectations
# ---------------------------------------------------------------------------

screening:
  - new_object: fire
    scene: [wood, rock, water, iron sword]
    should_include: [wood, water]
    should_exclude: [rock]
    note: "fire finds flammable/liquid interesting"

  - new_object: magnet
    scene: [iron sword, wooden shield, feather, rock]
    should_include: [iron sword]
    should_exclude: [feather]
    note: "magnet finds metallic interesting"

  - new_object: acid
    scene: [glass bottle, stone wall, boulder, feather]
    should_include: [glass bottle]
    note: "acid interacts with breakable/rigid"

  - new_object: tornado
    scene: [feather, smoke cloud, boulder, rock]
    should_include: [feather, smoke cloud]
    note: "wind affects light/gas objects"

  - new_object: zombie
    scene: [person, rock, wooden sword, campfire]
    should_include: [person]
    should_exclude: [rock]
    note: "zombie is interested in living things"

  - new_object: water
    scene: [fire, rock, lightning, wood]
    should_include: [fire, lightning]
    should_exclude: [rock]
    note: "water extinguishes fire and conducts electricity"

  - new_object: bomb
    scene: [glass window, boulder, person, feather]
    should_include: [glass window, person]
    note: "explosion destroys fragile and damages living"

  - new_object: cat
    scene: [mouse, rock, dog, ball of yarn]
    should_include: [mouse, dog]
    should_exclude: [rock]
    note: "cat hunts mice, reacts to dogs, ignores rock"

  - new_object: ice cube
    scene: [water, rock, person, fire]
    should_include: [water, fire]
    should_exclude: [rock]
    note: "ice freezes water, melts near fire, ignores rock"

  - new_object: lightning
    scene: [iron sword, water, rock, wood]
    should_include: [iron sword, water]
    should_exclude: [rock]
    note: "lightning seeks conductors"


# ---------------------------------------------------------------------------
# Creature behavior expectations
# ---------------------------------------------------------------------------

creatures:
  - creature: zombie
    targets:
      - name: brain
        expected:
          movement: 0
          action: [1, 5, 6]
          priority: {min: 2, max: 3}
        note: "zombie eats brains"
      - name: fire
        expected:
          movement: [0, 1]
          priority: {min: 2, max: 3}
        note: "zombie may flee or be too dumb — genuinely ambiguous"
      - name: person
        expected:
          movement: 0

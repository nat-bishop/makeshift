# ---------------------------------------------------------------------------
# Creation tests � objects to run through create_object() with expected ranges
# ---------------------------------------------------------------------------
# Ranges [lo, hi] are binary pass/fail. Exact values (bool, int) are exact match.

creation_tests:
  - name: iron sword
    expected:
      mass_kg: [0.5, 3]
      height_cm: [50, 120]
      bounce: [5, 30]
      gravity: [50, 75]
      autonomous: false
      affordance: 0
      surface: 1
      durability: [3, 4]

  - name: wooden shield
    expected:
      mass_kg: [2, 10]
      height_cm: [30, 120]
      bounce: [5, 30]
      gravity: [45, 65]


# Unified eval fixture � single source of truth for all eval runners.
#
# "archetypes" = fixed physics for building blueprints in pairwise/creature/screening tests.
# "creation_tests" = objects to run through create_object(), with expected output ranges.
#
# These are separate concerns: archetypes are known-good inputs,
# creation_tests define what the LLM should produce.

# ---------------------------------------------------------------------------
# Archetypes � hand-built physics for pairwise, creature, and screening evals
# ---------------------------------------------------------------------------

archetypes:

# Unified eval fixture — single source of truth for all eval runners.
#
# "archetypes" = fixed physics for building blueprints in pairwise/creature/screening tests.
# "creation_tests" = objects to run through create_object(), with expected output ranges.
#
# These are separate concerns: archetypes are known-good inputs,
# creation_tests define what the LLM should produce.

# ---------------------------------------------------------------------------
# Archetypes — hand-built physics for pairwise, creature, and screening evals
# ---------------------------------------------------------------------------

archetypes:
  # Weapons / Tools
  iron sword: { mass_kg: 2.0, height_cm: 90, friction: 35, bounce: 15, gravity: 60 }
  wooden shield: { mass_kg: 2.0, height_cm: 60, friction: 45, bounce: 15, gravity: 55, armor: 40 }
  wooden sword: { mass_kg: 1.0, height_cm: 80, friction: 45, bounce: 15, gravity: 55 }
  sword: { mass_kg: 2.0, height_cm: 90, friction: 35, bounce: 15, gravity: 60 }

  # Fire / Heat
  campfire: { mass_kg: 5.0, height_cm: 60, friction: 30, bounce: 5, gravity: 55, has_field: true, field_range_cm: 150 }
  fire: { mass_kg: 0.1, height_cm: 40, friction: 5, bounce: 5, gravity: 10, has_field: true, field_range_cm: 100 }
  lava: { mass_kg: 10.0, height_cm: 20, friction: 30, bounce: 5, gravity: 60, has_field: true, field_range_cm: 120 }

  # Living
  zombie: { mass_kg: 70.0, height_cm: 175, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  horse: { mass_kg: 400.0, height_cm: 200, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  person: { mass_kg: 70.0, height_cm: 175, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  rabbit: { mass_kg: 2.0, height_cm: 25, friction: 40, bounce: 15, gravity: 50, autonomous: true }

  # Glass / Fragile
  glass bottle: { mass_kg: 0.4, height_cm: 25, friction: 20, bounce: 10, gravity: 55, armor: 10 }
  glass window: { mass_kg: 2.0, height_cm: 100, friction: 15, bounce: 10, gravity: 55, armor: 5 }
  glass vase: { mass_kg: 0.5, height_cm: 30, friction: 20, bounce: 10, gravity: 55, armor: 8 }

  # Rubber / Bouncy
  bouncy ball: { mass_kg: 0.2, height_cm: 10, friction: 60, bounce: 80, gravity: 50 }

  # Stone
  mountain: { mass_kg: 50000.0, height_cm: 5000, friction: 50, bounce: 5, gravity: 70 }
  boulder: { mass_kg: 100.0, height_cm: 80, friction: 40, bounce: 5, gravity: 70, armor: 70 }
  rock: { mass_kg: 5.0, height_cm: 20, friction: 40, bounce: 10, gravity: 60, armor: 60 }
  stone wall: { mass_kg: 200.0, height_cm: 300, friction: 50, bounce: 5, gravity: 70, armor: 80, indestructible: true }

  # Ice / Cold
  ice cube: { mass_kg: 0.3, height_cm: 8, friction: 5, bounce: 20, gravity: 50 }
  ice: { mass_kg: 2.0, height_cm: 30, friction: 5, bounce: 20, gravity: 52 }

  # Wood
  wood: { mass_kg: 3.0, height_cm: 50, friction: 50, bounce: 15, gravity: 55 }
  ladder: { mass_kg: 5.0, height_cm: 200, friction: 45, bounce: 10, gravity: 55 }

  # Light / Airy
  feather: { mass_kg: 0.005, height_cm: 15, friction: 20, bounce: 10, gravity: 15 }
  smoke cloud: { mass_kg: 0.01, height_cm: 100, friction: 0, bounce: 0, gravity: 5 }
  balloon: { mass_kg: 0.05, height_cm: 30, friction: 20, bounce: 40, gravity: 10 }

  # Explosives
  dynamite: { mass_kg: 0.5, height_cm: 20, friction: 40, bounce: 10, gravity: 55 }
  bomb: { mass_kg: 3.0, height_cm: 25, friction: 35, bounce: 10, gravity: 60 }

  # Electrical
  lightning rod: { mass_kg: 3.0, height_cm: 150, friction: 30, bounce: 10, gravity: 60, has_field: true, field_range_cm: 80 }
  live wire: { mass_kg: 0.5, height_cm: 200, friction: 20, bounce: 5, gravity: 55, has_field: true, field_range_cm: 50 }
  lightning: { mass_kg: 0.01, height_cm: 500, friction: 0, bounce: 0, gravity: 5, has_field: true, field_range_cm: 200 }

  # Liquids
  water: { mass_kg: 2.0, height_cm: 10, friction: 5, bounce: 5, gravity: 50 }
  water puddle: { mass_kg: 1.0, height_cm: 5, friction: 5, bounce: 5, gravity: 50 }

  # Acid
  acid: { mass_kg: 1.0, height_cm: 10, friction: 5, bounce: 5, gravity: 50, has_field: true, field_range_cm: 30 }

  # Wind
  fan: { mass_kg: 3.0, height_cm: 40, friction: 30, bounce: 10, gravity: 55, has_field: true, field_range_cm: 200 }
  tornado: { mass_kg: 0.1, height_cm: 500, friction: 0, bounce: 0, gravity: 10, has_field: true, field_range_cm: 300 }

  # Magnetic
  magnet: { mass_kg: 1.0, height_cm: 10, friction: 30, bounce: 10, gravity: 55, has_field: true, field_range_cm: 100 }

  # Toxic
  poison mushroom: { mass_kg: 0.1, height_cm: 10, friction: 40, bounce: 10, gravity: 50, has_field: true, field_range_cm: 20 }

  # Reflective
  mirror shield: { mass_kg: 3.0, height_cm: 60, friction: 20, bounce: 30, gravity: 55, armor: 50 }

  # Frozen
  frozen statue: { mass_kg: 50.0, height_cm: 180, friction: 10, bounce: 5, gravity: 65, armor: 20 }

  # Sticky
  tar pit: { mass_kg: 100.0, height_cm: 30, friction: 90, bounce: 0, gravity: 60, has_field: true, field_range_cm: 100 }

  # Creature eval targets
  brain: { mass_kg: 1.4, height_cm: 15, friction: 30, bounce: 10, gravity: 50 }
  burning tree: { mass_kg: 200.0, height_cm: 400, friction: 40, bounce: 5, gravity: 60, has_field: true, field_range_cm: 200 }
  injured person: { mass_kg: 70.0, height_cm: 175, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  mouse: { mass_kg: 0.03, height_cm: 5, friction: 30, bounce: 15, gravity: 50, autonomous: true }
  dog: { mass_kg: 25.0, height_cm: 60, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  ball of yarn: { mass_kg: 0.1, height_cm: 10, friction: 50, bounce: 30, gravity: 50 }
  player: { mass_kg: 70.0, height_cm: 175, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  criminal: { mass_kg: 75.0, height_cm: 180, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  flower: { mass_kg: 0.05, height_cm: 30, friction: 30, bounce: 10, gravity: 50 }
  bear: { mass_kg: 300.0, height_cm: 150, friction: 40, bounce: 5, gravity: 60, autonomous: true }
  garlic: { mass_kg: 0.05, height_cm: 5, friction: 40, bounce: 10, gravity: 50 }
  wolf: { mass_kg: 40.0, height_cm: 80, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  lava pool: { mass_kg: 10.0, height_cm: 20, friction: 30, bounce: 5, gravity: 60, has_field: true, field_range_cm: 120 }
  sheep: { mass_kg: 60.0, height_cm: 100, friction: 40, bounce: 10, gravity: 55, autonomous: true }
  grass: { mass_kg: 0.1, height_cm: 20, friction: 40, bounce: 5, gravity: 50 }



# ---------------------------------------------------------------------------
# Screening expectations
# ---------------------------------------------------------------------------

screening:
  - new_object: fire
    scene: [wood, rock, water, iron sword]
    should_include: [wood, water]
    should_exclude: [rock]
    note: "fire finds flammable/liquid interesting"

  - new_object: magnet
    scene: [iron sword, wooden shield, feather, rock]
    should_include: [iron sword]
    should_exclude: [feather]
    note: "magnet finds metallic interesting"

  - new_object: acid
    scene: [glass bottle, stone wall, boulder, feather]
    should_include: [glass bottle]
    note: "acid interacts with breakable/rigid"

  - new_object: tornado
    scene: [feather, smoke cloud, boulder, rock]
    should_include: [feather, smoke cloud]
    note: "wind affects light/gas objects"

  - new_object: zombie
    scene: [person, rock, wooden sword, campfire]
    should_include: [person]
    should_exclude: [rock]
    note: "zombie is interested in living things"

  - new_object: water
    scene: [fire, rock, lightning, wood]
    should_include: [fire, lightning]
    should_exclude: [rock]
    note: "water extinguishes fire and conducts electricity"

  - new_object: bomb
    scene: [glass window, boulder, person, feather]
    should_include: [glass window, person]
    note: "explosion destroys fragile and damages living"

  - new_object: cat
    scene: [mouse, rock, dog, ball of yarn]
    should_include: [mouse, dog]
    should_exclude: [rock]
    note: "cat hunts mice, reacts to dogs, ignores rock"

  - new_object: ice cube
    scene: [water, rock, person, fire]
    should_include: [water, fire]
    should_exclude: [rock]
    note: "ice freezes water, melts near fire, ignores rock"

  - new_object: lightning
    scene: [iron sword, water, rock, wood]
    should_include: [iron sword, water]
    should_exclude: [rock]
    note: "lightning seeks conductors"


# ---------------------------------------------------------------------------
# Behavior expectations (creatures + reactive objects)
# ---------------------------------------------------------------------------

behaviors:
  # -- Creatures --
  - subject: zombie
    targets:
      - name: brain
        expected:
          movement: 0
          action: [1, 3]
          priority: {min: 2, max: 3}
        note: "zombie eats brains"
      - name: fire
        expected:
          movement: [0, 1]
          priority: {min: 2, max: 3}
        note: "zombie may flee or be too dumb — genuinely ambiguous"
      - name: person
        expected:
          movement: 0
          action: 1
          amount: {min: 15, max: 100}
          state_action: 0
          delivery: 0
          priority: {min: 2, max: 3}
        note: "zombie attacks living people — contact bite/swipe, no projectile"

  - subject: firefighter
    targets:
      - name: burning tree
        expected:
          movement: 0
          action: [1, 2]
          state_action: [0, 2]
          priority: {min: 2, max: 3}
        note: "firefighter extinguishes fire — attack (fight fire) or heal (save tree), both valid"
      - name: injured person
        expected:
          movement: 0
          action: 2
          amount: {min: 15, max: 100}
        note: "firefighter heals injured"
      - name: rock
        expected:
          movement: 2
          action: 0
          priority: {min: 0, max: 1}
        note: "firefighter ignores non-emergency"

  - subject: cat
    targets:
      - name: mouse
        expected:
          movement: 0
          action: [1, 3]
          priority: {min: 1, max: 3}
        note: "cat hunts mice"
      - name: dog
        expected:
          movement: 1
          priority: {min: 2, max: 3}
        note: "cat is genuinely afraid of dogs — not mild"
      - name: ball of yarn
        expected:
          movement: 0
          priority: {min: 1, max: 3}
        note: "cat plays with yarn — should be visibly interested"

  - subject: guard dog
    targets:
      - name: player
        expected:
          movement: 0
          priority: {min: 1, max: 3}
        note: "guard dog patrols near player — should be attentive"
      - name: criminal
        expected:
          movement: 0
          action: 1
          amount: {min: 15, max: 100}
          state_action: 0
          priority: {min: 2, max: 3}
        note: "guard dog attacks threats — no elemental state change"

  - subject: doctor
    targets:
      - name: injured person
        expected:
          movement: 0
          action: 2
          amount: {min: 20, max: 100}
          priority: {min: 2, max: 3}
        note: "doctor strongly wants to heal injured"

  - subject: bee
    targets:
      - name: flower
        expected:
          movement: 0
          priority: {min: 1, max: 3}
        note: "bee approaches flowers — should be noticeably interested"
      - name: bear
        expected:
          movement: [0, 1]
          action: [0, 1]
        note: "bee may attack or flee — both reasonable for a lone bee vs bear"
      - name: person
        expected:
          action: [0, 1]
          delivery: 0
        note: "bee uses contact sting, never projectile"

  - subject: vampire
    targets:
      - name: garlic
        expected:
          movement: 1

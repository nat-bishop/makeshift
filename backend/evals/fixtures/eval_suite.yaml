# ---------------------------------------------------------------------------
# Pairwise interaction expectations
# ---------------------------------------------------------------------------
# damage ranges: [lo, hi]. State: string or list of acceptable strings.
# A/B sides follow fixture order; orient_expected() handles eval_pair's sort.

pairs:
  # Fire / Heat
  - pair: [fire, wood]
    expected: { damage_b: [15, 100], state_b: [burning], continuous: true }
    note: "fire ignites wood — ongoing burn, not a flash"

  - pair: [fire, ice]
    expected: { damage_b: [10, 75], state_b: [remove_frozen, wet] }
    note: "fire melts ice — melting deals damage too"

  - pair: [water, fire]
    expected: { state_b: [remove_burning, wet] }
    note: "water extinguishes fire"

  - pair: [lava, wood]
    expected: { damage_b: [50, 100], state_b: [burning], continuous: true }
    note: "lava ignites wood — ongoing burn"

  - pair: [lava, person]
    expected: { damage_b: [50, 100], state_b: [burning], continuous: true }
    note: "lava sets you on fire and keeps burning"

  # Sharp / Impact
  - pair: [sword, glass bottle]
    expected: { damage_b: [25, 100] }
    note: "sharp damages fragile — moderate to obliterated"

  - pair: [boulder, glass bottle]
    expected: { damage_b: [75, 100] }
    note: "100kg boulder obliterates glass"

  # Cold / Freeze
  - pair: [ice cube, lava]
    expected: { damage_a: [75, 100] }
    note: "ice cube vaporizes on contact with lava"

  # Explosive
  - pair: [dynamite, campfire]
    expected: { damage_a: [30, 100], damage_b: [20, 100] }
    note: "heat detonates explosive"

  - pair: [bomb, glass window]
    expected: { damage_b: [40, 100], force_b: [20, 100] }
    note: "explosion destroys and blows away fragile"

  # Electricity
  - pair: [lightning rod, iron sword]
    expected: { state_b: [electrified] }
    note: "electric + metallic = electrify"

  - pair: [live wire, water puddle]
    expected: { state_b: [electrified] }
    note: "electric + liquid = electrify"

  - pair: [lightning, person]
    expected: { damage_b: [50, 100], state_b: [electrified] }
    note: "lightning strike is severe and electrifies"

  # Acid
  - pair: [acid, glass bottle]
    expected: { damage_b: [0, 25] }
    note: "glass is acid-resistant — low or no damage expected"

  - pair: [acid, stone wall]
    expected: { damage_b: [0, 50] }
    note: "acid may damage rigid — 0 acceptable for indestructible"

  - pair: [acid, person]
    expected: { damage_b: [15, 75], continuous: true }
    note: "acid burns living — ongoing corrosion"

  # Wind
  - pair: [fan, feather]
    expected: { force_b: [25, 100] }
    note: "wind pushes light"

  # smoke cloud vs tornado: force test removed — same orient issue.
  # smoke_cloud is lex-A, so force_b measures force on tornado, not smoke_cloud.
  # TODO: re-add when PairwiseResult supports force_a

  # Magnetic
  # magnet vs iron sword: force test removed — force_b only measures force on
  # lex-sorted B (magnet), but we want force on iron sword. Needs force_a field.
  # TODO: re-add when PairwiseResult supports force_a

  # Toxic
  - pair: [poison mushroom, rabbit]
    expected: { damage_b: [10, 50], continuous: true }
    note: "poison damages living — noticeable and ongoing"

  # Frozen + fragile
  - pair: [frozen statue, glass vase]
    expected: { damage_b: [50, 100] }
    note: "50kg frozen object shatters thin glass"

  # Sticky
  - pair: [tar pit, person]
    expected: { continuous: true }
    note: "tar slows movement"

  # Boring pairs
  - pair: [rock, rock]
    expected: { damage_a: [0, 10], damage_b: [0, 10] }
    note: "inert pair, minimal"

  - pair: [wooden sword, wooden shield]
    expected: { damage_b: [0, 20] }
    note: "wood on wood, minor"

  # Complex unambiguous interactions
  - pair: [bomb, person]
    expected: { damage_b: [50, 100], force_b: [20, 100] }
    note: "bomb explosion devastates and blows person back"

  # tornado vs balloon: force test removed — same orient issue as magnet.
  # balloon is lex-A, so force_b measures force on tornado, not balloon.
  # TODO: re-add when PairwiseResult supports force_a

  - pair: [fire, balloon]
    expected: { damage_b: [50, 100] }
    note: "heat pops balloon"

  - pair: [boulder, wooden sword]
    expected: { damage_b: [50, 100] }
    note: "heavy crushes light wood"

  - pair: [lightning, water]
    expected: { state_b: [electrified] }
    note: "electricity conducts through water"

  # Obvious damage — sanity checks
  - pair: [fire, person]
    expected: { damage_b: [20, 100], state_b: [burning], continuous: true }
    note: "fire burns people — ongoing, not a flash"

  - pair: [sword, person]
    expected: { damage_b: [15, 100] }
    note: "weapon wounds people — should be noticeable"

  # Continuous interactions (boosting from 1 to 5 test cases)
  - pair: [campfire, person]
    expected: { damage_b: [15, 75], state_b: [burning], continuous: true }
    note: "standing in campfire burns and sets you on fire"

  - pair: [acid, iron sword]
    expected: { damage_b: [5, 50], continuous: true }
    note: "acid continuously corrodes metal"

  - pair: [lava, iron sword]
    expected: { damage_b: [25, 100], continuous: true }
    note: "lava continuously melts metal"

  - pair: [poison mushroom, person]
    expected: { damage_b: [10, 50], continuous: true }
    note: "toxic exposure is noticeable and continuous"

  # State: wet (0 direct add tests -> 2)
  - pair: [water, person]
    expected: { state_b: [wet] }
    note: "water wets person"

  - pair: [water, wood]
    expected: { state_b: [wet] }
    note: "water soaks wood"

  # State: frozen (1 -> 3)
  - pair: [ice, person]
    expected: { state_b: [frozen, wet], damage_b: [5, 50] }
    note: "ice freezes or wets person — both valid"

  - pair: [ice cube, iron sword]
    expected: { state_b: [frozen] }
    note: "ice freezes metal"

  # damage_a tests (boosting A-side damage coverage)
  - pair: [feather, campfire]
    expected: { damage_a: [25, 100] }
    note: "feather burns easily in fire"

  - pair: [glass bottle, rock]
    expected: { damage_a: [25, 100], damage_b: [0, 15] }
    note: "glass shatters against rock; rock barely scratched"

  - pair: [dynamite, lava]
    expected: { damage_a: [30, 100] }
    note: "lava heat detonates dynamite"

  - pair: [bomb, boulder]
    expected: { damage_a: [20, 100], damage_b: [10, 75] }
    note: "explosion damages both — boulder is tough but not immune"

  - pair: [feather, feather]
    expected: { damage_a: [0, 5], damage_b: [0, 5] }
    note: "two feathers do nothing to each other"

  # Force tests — target object must sort after source for force_b to measure it
  - pair: [fan, smoke cloud]
    expected: { force_b: [10, 100] }
    note: "wind disperses gas"

  - pair: [fan, rock]
    expected: { force_b: [0, 10] }
    note: "fan cannot move heavy rock — mass matters"

  - pair: [magnet, sword]
    expected: { force_b: [-100, -10] }
    note: "magnet pulls metallic sword (negative = pull)"

  # Interesting behavior tests — dramatic outcomes over boring ones
  - pair: [boulder, person]
    expected: { damage_b: [40, 100], force_b: [20, 100] }
    note: "boulder crushes and sends person flying"

  - pair: [lava, balloon]
    expected: { damage_b: [50, 100] }
    note: "lava dramatically pops balloon"

  - pair: [fire, ice cube]
    expected: { damage_b: [20, 100], state_b: [remove_frozen, wet] }
    note: "fire melts and damages ice cube"

  - pair: [bomb, campfire]
    expected: { damage_a: [30, 100], damage_b: [30, 100] }
    note: "fire detonates bomb — chain reaction damages both"

  - pair: [lightning, iron sword]
    expected: { damage_b: [10, 75], state_b: [electrified] }
    note: "lightning damages and electrifies metal"

  - pair: [tornado, person]
    expected: { damage_b: [10, 75] }
    note: "tornado tosses person — should deal damage"

  - pair: [lava, ice]
    expected: { damage_b: [50, 100], state_b: [remove_frozen, wet] }
    note: "lava obliterates ice — melts and damages"


# ---------------------------------------------------------------------------
# Screening expectations
# ---------------------------------------------------------------------------

screening:
  - new_object: fire
    scene: [wood, rock, water, iron sword]
    should_include: [wood, water]
    should_exclude: [rock]
    note: "fire finds flammable/liquid interesting"

  - new_object: magnet
    scene: [iron sword, wooden shield, feather, rock]
    should_include: [iron sword]
    should_exclude: [feather]
    note: "magnet finds metallic interesting"

  - new_object: acid
    scene: [glass bottle, stone wall, boulder, feather]
    should_include: [glass bottle]
    note: "acid interacts with breakable/rigid"

  - new_object: tornado
    scene: [feather, smoke cloud, boulder, rock]
    should_include: [feather, smoke cloud]
    note: "wind affects light/gas objects"

  - new_object: zombie
    scene: [person, rock, wooden sword, campfire]
    should_include: [person]
    should_exclude: [rock]
    note: "zombie is interested in living things"

  - new_object: water
    scene: [fire, rock, lightning, wood]
    should_include: [fire, lightning]
    should_exclude: [rock]
    note: "water extinguishes fire and conducts electricity"

  - new_object: bomb
    scene: [glass window, boulder, person, feather]
    should_include: [glass window, person]
    note: "explosion destroys fragile and damages living"

  - new_object: cat
    scene: [mouse, rock, dog, ball of yarn]
    should_include: [mouse, dog]
    should_exclude: [rock]
    note: "cat hunts mice, reacts to dogs, ignores rock"

  - new_object: ice cube
    scene: [water, rock, person, fire]
    should_include: [water, fire]
    should_exclude: [rock]
    note: "ice freezes water, melts near fire, ignores rock"

  - new_object: lightning
    scene: [iron sword, water, rock, wood]
    should_include: [iron sword, water]
    should_exclude: [rock]
    note: "lightning seeks conductors"


# ---------------------------------------------------------------------------
# Creature behavior expectations
# ---------------------------------------------------------------------------
# movement: 0=approach, 1=flee, 2=orbit, 3=ignore
# action: 0=nothing, 1=damage, 2=heal, 3=add_state, 4=remove_state, 5=destroy, 6=take
# Lists mean any of these values is acceptable.

creatures:
  - creature: zombie
    targets:
      - name: brain
        expected: { movement: 0, action: [1, 5, 6], strength: { min: 50, max: 100 } }
        note: "zombie eats brains"
      - name: fire
        expected: { movement: [0, 1], strength: { min: 40, max: 100 } }
        note: "zombie may flee or be too dumb — genuinely ambiguous"
      - name: person
        expected: { movement: 0, action: 1, amount: { min: 15, max: 100 }, strength: { min: 50, max: 100 } }
        note: "zombie attacks living people"

  - creature: firefighter
    targets:
      - name: burning tree
        expected: { movement: 0, action: [2, 4], strength: { min: 50, max: 100 } }
        note: "firefighter extinguishes fire — should heal or remove_state, not just approach"
      - name: injured person
        expected: { movement: 0, action: 2, amount: { min: 15, max: 100 } }
        note: "firefighter heals injured"

  - creature: cat
    targets:
      - name: mouse
        expected: { movement: 0, action: [1, 5, 6], strength: { min: 30, max: 100 } }
        note: "cat hunts mice"
      - name: dog
        expected: { movement: 1, strength: { min: 40, max: 100 } }
        note: "cat is genuinely afraid of dogs — not mild"
      - name: ball of yarn
        expected: { movement: [0, 2], strength: { min: 20, max: 80 } }
        note: "cat plays with yarn — should be visibly interested"

  - creature: guard dog
    targets:
      - name: player
        expected: { movement: [0, 2], strength: { min: 30, max: 100 } }
        note: "guard dog patrols near player — should be attentive"
      - name: criminal
        expected: { movement: 0, action: 1, amount: { min: 15, max: 100 }, strength: { min: 50, max: 100 } }
        note: "guard dog attacks threats"

  - creature: doctor
    targets:
      - name: injured person

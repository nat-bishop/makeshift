# Reference physics values for calibrating LLM reasonableness checks.
# Derived from V2 SUBSTANCE_PROFILES. Ranges are approximate —
# the LLM should produce values in these ballparks for objects
# made of these materials.
#
# mass: kg (real-world units)
# friction/bounce/gravity: 0-100 integer scales


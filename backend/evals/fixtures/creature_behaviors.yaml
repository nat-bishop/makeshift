  expected: {movement: 0, action: 5}
  note: "cat hunts mice — approach and destroy"

- creature: cat
  target: dog
  expected: {movement: 1}
  note: "cat runs from dogs — flee"

- creature: cat
  target: ball of yarn
  expected: {movement: 2}
  note: "cat plays with yarn — orbit"


# Expected creature behavior pairs for V3 eval.
# Each entry describes what a creature should do when encountering a target.
# movement: approach(0), flee(1), orbit(2), ignore(3)
# action: nothing(0), damage(1), heal(2), add_state(3), remove_state(4), destroy(5), take(6)

- creature: zombie
  target: brain
  expected: {movement: 0, action: 5}
  note: "zombie eats brains — approach and destroy"

- creature: zombie
  target: fire
  expected: {movement: 1}
  note: "zombie avoids fire — flee"

- creature: firefighter
  target: burning tree
  expected: {movement: 0, action: 4, param: 1}
  note: "firefighter extinguishes fire — approach, remove on_fire"

- creature: firefighter
  target: injured person
  expected: {movement: 0, action: 2}
  note: "firefighter rescues injured — approach, heal"

- creature: cat

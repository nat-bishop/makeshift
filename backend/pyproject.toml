[project]
name = "llmgame-backend"
version = "0.1.0"
description = "LLM Sandbox Game backend - Scribblenauts meets Terraria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10",
    "pydantic-ai>=0.1.0",
    "pydantic-settings>=2.5.0",
    "fal-client>=0.5.0",
    "rembg[cpu]>=2.0.0",
    "Pillow>=10.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelLab Character Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 24px;
    color: #fff;
    border-bottom: 2px solid #333;
    padding-bottom: 12px;
  }
  h2 {
    font-size: 18px;
    margin-bottom: 12px;
    color: #9ecfff;
  }
  h3 {
    font-size: 14px;
    color: #7b8794;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .characters {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .character-card {
    background: #16213e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
  }
  .character-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .character-header .status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .status.ready { background: #1b4332; color: #95d5b2; }
  .status.pending { background: #4a3728; color: #f0c040; }
  .status.failed { background: #4a2028; color: #f08080; }
  .rotations {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .rotation-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .rotation-frame img {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    background: #0a0a1a;
    border: 1px solid #333;
    border-radius: 4px;
  }
  .rotation-frame span {
    font-size: 10px;
    color: #666;
  }
  .animations {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 16px;
  }
  .animation-group {
    background: #0f1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 16px;
  }
  .animation-name {
    font-size: 14px;
    font-weight: 600;
    color: #c0d0e0;
    margin-bottom: 12px;
  }
  .animation-directions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .anim-direction {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .anim-direction .dir-label {
    font-size: 12px;
    color: #666;
    width: 80px;
    flex-shrink: 0;
  }
  .anim-preview {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    background: #0a0a1a;
    border: 1px solid #333;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .anim-frames {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .anim-frames img {
    width: 48px;
    height: 48px;
    image-rendering: pixelated;
    background: #0a0a1a;
    border: 1px solid #252535;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .anim-frames img:hover {
    border-color: #5588cc;
  }
  .anim-frames img.active {
    border-color: #5588cc;
    box-shadow: 0 0 6px rgba(85, 136, 204, 0.4);
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .controls label {
    font-size: 12px;
    color: #888;
  }
  .controls input[type="range"] {
    width: 100px;
  }
  .speed-val {
    font-size: 12px;
    color: #aaa;
    min-width: 40px;
  }
  button {
    background: #2a4a7f;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  button:hover { background: #3a5a9f; }
  button:disabled { background: #333; color: #666; cursor: default; }
  .refresh-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  .refresh-bar span { font-size: 12px; color: #666; }
  .empty-state {
    color: #555;
    font-style: italic;
    font-size: 13px;
    padding: 8px 0;
  }
  .comparison {
    margin-top: 32px;
    background: #16213e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
  }
  .comparison .side-by-side {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }
  .comparison .side-by-side .panel {
    text-align: center;
  }
  .comparison .side-by-side .panel canvas {
    image-rendering: pixelated;
    border: 1px solid #333;
    border-radius: 8px;
    background: #0a0a1a;
  }
  .comparison .side-by-side .panel .label {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
  }
  .original-sprite {
    image-rendering: pixelated;
    border: 1px solid #333;
    border-radius: 8px;
    background: #0a0a1a;
  }
</style>
</head>
<body>

<h1>PixelLab Character Dashboard</h1>

<div class="refresh-bar">
  <button id="refreshBtn" onclick="refreshAll()">Refresh All</button>
  <span id="lastRefresh">Not refreshed yet</span>
</div>

<div class="comparison" id="comparisonSection" style="display:none">
  <h2>Side-by-Side Comparison</h2>
  <div class="controls" style="margin-bottom: 16px">
    <label>Animation Speed:</label>
    <input type="range" id="compSpeed" min="2" max="20" value="8" oninput="updateCompSpeed(this.value)">
    <span class="speed-val" id="compSpeedVal">8 fps</span>
    <label style="margin-left:16px">Scale:</label>
    <input type="range" id="compScale" min="2" max="8" value="4" oninput="updateCompScale(this.value)">
    <span class="speed-val" id="compScaleVal">4x</span>
  </div>
  <div class="side-by-side" id="comparisonPanels"></div>
</div>

<div class="characters" id="characterList">
  <p class="empty-state">Loading characters...</p>
</div>

<script>
const CHARACTERS = {};
let compFps = 8;
let compScale = 4;
const animationTimers = {};

// Known character data — will be populated by MCP calls
// We'll build this up from the get_character responses

const CHARACTER_DATA = {
  "4aa6620d-b07f-4e54-8ed7-8688c2288afe": {
    name: "Tamagotchi Character",
    status: "ready",
    size: 56,
    directions: 8,
    view: "low top-down",
    rotations: {
      south: "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/south.png?t=1774556427271",
      east: "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/east.png?t=1774556427271",
      north: "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/north.png?t=1774556427271",
      west: "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/west.png?t=1774556427271",
      "south-east": "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/south-east.png?t=1774556427271",
      "north-east": "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/north-east.png?t=1774556427271",
      "north-west": "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/north-west.png?t=1774556427271",
      "south-west": "https://backblaze.pixellab.ai/file/pixellab-characters/24c91e0a-2827-4aaa-8698-f3f3f12d5a65/4aa6620d-b07f-4e54-8ed7-8688c2288afe/rotations/south-west.png?t=1774556427271",
    },
    animations: {}
  },
  "413ea3df-e202-426a-9a5d-8966db169f8c": {
    name: "Explorer Kid v2",
    status: "pending",
    size: 48,
    directions: 4,
    view: "side",
    rotations: {},
    animations: {}
  }
};

function renderCharacters() {
  const container = document.getElementById('characterList');
  const ids = Object.keys(CHARACTER_DATA);
  if (ids.length === 0) {
    container.innerHTML = '<p class="empty-state">No characters found.</p>';
    return;
  }

  container.innerHTML = '';
  for (const id of ids) {
    const char = CHARACTER_DATA[id];
    const card = document.createElement('div');
    card.className = 'character-card';
    card.id = `char-${id}`;

    let rotationsHtml = '';
    const dirs = Object.entries(char.rotations);
    if (dirs.length > 0) {
      rotationsHtml = '<h3>Rotations</h3><div class="rotations">';
      for (const [dir, url] of dirs) {
        rotationsHtml += `<div class="rotation-frame"><img src="${url}" alt="${dir}" crossorigin="anonymous"><span>${dir}</span></div>`;
      }
      rotationsHtml += '</div>';
    }

    let animationsHtml = '';
    const anims = Object.entries(char.animations);
    if (anims.length > 0) {
      animationsHtml = '<h3>Animations</h3><div class="animations">';
      for (const [animName, animData] of anims) {
        animationsHtml += `<div class="animation-group">
          <div class="animation-name">${animName} <span style="font-weight:normal;color:#666">(${animData.status || 'ready'})</span></div>
          <div class="controls">
            <label>Speed:</label>
            <input type="range" min="2" max="20" value="8" oninput="updateAnimSpeed('${id}','${animName}',this.value)">
            <span class="speed-val" id="speed-${id}-${animName}">8 fps</span>
          </div>
          <div class="animation-directions">`;

        for (const [dir, frames] of Object.entries(animData.directions || {})) {
          if (!frames || frames.length === 0) continue;
          const canvasId = `canvas-${id}-${animName}-${dir}`;
          const framesId = `frames-${id}-${animName}-${dir}`;
          animationsHtml += `<div class="anim-direction">
            <span class="dir-label">${dir}</span>
            <canvas id="${canvasId}" class="anim-preview" width="80" height="80"></canvas>
            <div class="anim-frames" id="${framesId}">`;
          for (let i = 0; i < frames.length; i++) {
            animationsHtml += `<img src="${frames[i]}" alt="frame ${i}" crossorigin="anonymous" data-canvas="${canvasId}" data-frame="${i}" onclick="highlightFrame(this)">`;
          }
          animationsHtml += '</div></div>';
        }
        animationsHtml += '</div></div>';
      }
      animationsHtml += '</div>';
    }

    const statusClass = char.status === 'ready' ? 'ready' : char.status === 'failed' ? 'failed' : 'pending';

    card.innerHTML = `
      <div class="character-header">
        <h2>${char.name}</h2>
        <span class="status ${statusClass}">${char.status}</span>
        <span style="font-size:11px;color:#555">${char.size}px / ${char.directions} dirs / ${char.view}</span>
      </div>
      ${rotationsHtml}
      ${animationsHtml}
      ${!anims.length && char.status === 'ready' ? '<p class="empty-state">No animations yet</p>' : ''}
      ${char.status === 'pending' ? '<p class="empty-state">Character still generating... click Refresh to check</p>' : ''}
    `;
    container.appendChild(card);
  }

  // Start animation loops after DOM is ready
  requestAnimationFrame(() => startAllAnimations());
}

function startAllAnimations() {
  // Clear all existing timers
  for (const key in animationTimers) {
    clearInterval(animationTimers[key]);
    delete animationTimers[key];
  }

  for (const [id, char] of Object.entries(CHARACTER_DATA)) {
    for (const [animName, animData] of Object.entries(char.animations)) {
      for (const [dir, frames] of Object.entries(animData.directions || {})) {
        if (!frames || frames.length === 0) continue;
        startAnimLoop(id, animName, dir, frames, 8);
      }
    }
  }
}

function startAnimLoop(charId, animName, dir, frameUrls, fps) {
  const key = `${charId}-${animName}-${dir}`;
  if (animationTimers[key]) clearInterval(animationTimers[key]);

  const canvasId = `canvas-${charId}-${animName}-${dir}`;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Preload images
  const images = frameUrls.map(url => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url;
    return img;
  });

  let frameIdx = 0;
  function draw() {
    const img = images[frameIdx];
    ctx.clearRect(0, 0, 80, 80);
    if (img.complete && img.naturalWidth > 0) {
      // Scale to fit
      const scale = Math.min(80 / img.naturalWidth, 80 / img.naturalHeight);
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, (80 - w) / 2, (80 - h) / 2, w, h);
    }
    // Highlight active frame thumbnail
    const framesContainer = document.getElementById(`frames-${charId}-${animName}-${dir}`);
    if (framesContainer) {
      const thumbs = framesContainer.querySelectorAll('img');
      thumbs.forEach((t, i) => t.classList.toggle('active', i === frameIdx));
    }
    frameIdx = (frameIdx + 1) % images.length;
  }

  draw();
  animationTimers[key] = setInterval(draw, 1000 / fps);
}

function updateAnimSpeed(charId, animName, fps) {
  document.getElementById(`speed-${charId}-${animName}`).textContent = `${fps} fps`;
  const char = CHARACTER_DATA[charId];
  if (!char) return;
  const animData = char.animations[animName];
  if (!animData) return;
  for (const [dir, frames] of Object.entries(animData.directions || {})) {
    if (frames && frames.length) startAnimLoop(charId, animName, dir, frames, fps);
  }
}

function highlightFrame(img) {
  // Pause and show specific frame
  const canvasId = img.dataset.canvas;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const src = new Image();
  src.crossOrigin = 'anonymous';
  src.onload = () => {
    ctx.clearRect(0, 0, 80, 80);
    const scale = Math.min(80 / src.naturalWidth, 80 / src.naturalHeight);
    const w = src.naturalWidth * scale;
    const h = src.naturalHeight * scale;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, (80 - w) / 2, (80 - h) / 2, w, h);
  };
  src.src = img.src;
}

function updateCompSpeed(val) {
  compFps = parseInt(val);
  document.getElementById('compSpeedVal').textContent = `${val} fps`;
}

function updateCompScale(val) {
  compScale = parseInt(val);
  document.getElementById('compScaleVal').textContent = `${val}x`;
}

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing...';
  document.getElementById('lastRefresh').textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;

  // Note: The MCP tools don't expose a fetch API we can call from the browser.
  // This dashboard is designed to be updated by re-running the MCP get_character
  // calls and having Claude update the CHARACTER_DATA. For now, re-render.
  renderCharacters();

  btn.disabled = false;
  btn.textContent = 'Refresh All';
}

// Initial render
renderCharacters();
</script>

</body>
</html>

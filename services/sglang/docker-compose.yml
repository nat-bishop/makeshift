services:
  sglang:
    build: .
    container_name: makeshift-sglang
    ports:
      - "5100:5100"
    volumes:
      - ${HF_CACHE:-C:/Users/Nat/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - SGLANG_ENABLE_JIT_DEEPGEMM=0
      - SGLANG_ENABLE_DEEP_GEMM=0
      - SGLANG_DISABLE_DEEPGEMM=1
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - NCCL_SHM_DISABLE=1
      - NCCL_IB_DISABLE=1
    entrypoint: ["sglang", "serve"]
    command:
      - --model-path
      - ${LOCAL_IMAGE_MODEL:-black-forest-labs/FLUX.2-klein-9B}
      - --backend
      - diffusers
      - --cache-dit-config
      - /app/cache-dit-config.yaml
      - --config
      - /app/server-config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "5100"
    ipc: host
    pid: host
    shm_size: "32g"
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm:
    image: lmsysorg/sglang:dev-cu13
    container_name: makeshift-sglang-llm
    ports:
      - "5200:5200"
    volumes:
      - ${HF_CACHE:-C:/Users/Nat/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - SGLANG_ENABLE_JIT_DEEPGEMM=0
    entrypoint: ["python", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - ${LLM_MODEL:-Qwen/Qwen3.5-9B}
      - --host
      - "0.0.0.0"
      - --port
      - "5200"
      - --mem-fraction-static
      - "0.80"
      - --context-length
      - "262144"
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    ipc: host
    pid: host
    shm_size: "32g"
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5200/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  rembg:
    build:
      context: ../rembg
    container_name: makeshift-rembg
    ports:
      - "5150:5150"
    volumes:
      - ${U2NET_HOME:-C:/Users/Nat/.u2net}:/root/.u2net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5150/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


services:
  sglang:
    build: .
    container_name: makeshift-sglang
    ports:
      - "5100:5100"
    volumes:
      - ${HF_CACHE:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - SGLANG_ENABLE_JIT_DEEPGEMM=0
      - SGLANG_ENABLE_DEEP_GEMM=0
      - SGLANG_DISABLE_DEEPGEMM=1
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - NCCL_SHM_DISABLE=1
      - NCCL_IB_DISABLE=1
    entrypoint: ["sglang", "serve"]
    command:
      - --model-path
      - black-forest-labs/FLUX.2-klein-9B
      - --backend
      - diffusers
      - --cache-dit-config
      - /app/cache-dit-config.yaml
      - --config
      - /app/server-config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "5100"
    ipc: host
    pid: host
    shm_size: "32g"
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:

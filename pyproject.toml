[project]
name = "makeshift"
version = "0.1.0"
description = "Makeshift - Scribblenauts meets Terraria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10",
    "pydantic-ai>=0.1.0",
    "pydantic-settings>=2.5.0",
    "fal-client>=0.5.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "logfire[fastapi]>=4.0.0",
    "numpy>=1.24.0",
    "transformers>=5.4.0",
    "torchvision>=0.26.0",
    "einops>=0.8.0",
    "kornia>=0.8.0",
    "timm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx",
    "ruff==0.15.5",
    "mypy>=1.14",
    "pydantic-evals>=0.1.0",
    "scipy>=1.0.0",
]
experiment = [
    "diffusers>=0.36.0",
    "accelerate>=0.30.0",
    "imageio[ffmpeg]>=2.30.0",
    "sentencepiece>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["backend/experiments", "backend/scripts", "backend/evals/results"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "W",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PIE",
    "C4",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/creator/agent.py" = ["E501"]
"backend/app/cli.py" = ["T20"]
"backend/evals/test_*.py" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
follow_imports = "silent"
exclude = [
    "^\\.claude/",
    "^godot/",
    "backend/experiments/",
    "backend/scripts/",
    "backend/evals/",
]

[[tool.mypy.overrides]]
module = [
    "fal_client.*",
    "google.genai.*",
    "pydantic_ai.*",
    "structlog.*",
    "logfire.*",
    "transformers.*",
    "torchvision.*",
    "torch.*",
    "einops.*",
    "kornia.*",
    "timm.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[dependency-groups]
dev = []
